name: Refill approved PR Pacer posts
on:
  push:
    branches: [main]
    paths: ['plan.json', '.github/workflows/refill.yml']
  schedule:
    - cron: '17 13,19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-pacer-buffer-refill
  cancel-in-progress: false
jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate scheduling safeguards
        run: node --test refill.test.mjs
      - name: Schedule existing approved drafts within free queue limit
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node refill.mjs --apply
