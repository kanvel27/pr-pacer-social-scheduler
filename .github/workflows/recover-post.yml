name: Recover verified missing PR Pacer TikTok
on:
  push:
    branches: [main]
    paths: ['recover-post.mjs', '.github/workflows/recover-post.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-pacer-buffer-refill
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Retry the reconciled missing post once
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node recover-post.mjs
