name: Check PR Pacer published image identity
on:
  push:
    branches: [main]
    paths: ['media-audit.mjs', '.github/workflows/media-audit.yml']
permissions:
  contents: read
concurrency:
  group: pr-pacer-buffer-refill
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compare published cover with approved bytes
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node media-audit.mjs
